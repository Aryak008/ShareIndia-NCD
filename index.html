<style>
/* Layout: collapsible Share India blue rail (red = selected) + scrolling workspace of cards and tables */
:root{

}

  --btn:#3C6BD6;--btn-hi:#2F5BC2;--link:#91B2F6;--focus:#3C6BD6;
  --ok-bg:#0F2E20;--ok:#62D49E;--warn-bg:#33270D;--warn:#F2C46E;--bad-bg:#3A1716;--bad:#F59C95;--info-bg:#16264A;--info:#A0BDF7;
  --shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#0A2152;--brand-hi:#14347A;--brand-line:rgba(255,255,255,.1);--brand-muted:#A3B3D8;
  --bg:#0B111D;--surface:#121A2A;--surface-2:#162036;--line:#25314B;--line-soft:#1C2740;--fg:#E6EBF4;--muted:#9CA9C1;--faint:#6F7D97;

html,body{height:100%}

h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
h2{font-size:16px;font-weight:600;letter-spacing:-.01em}

/* controls */

.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}

.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}

.in{width:100%;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:400;font-size:14px}

td .btn.ghost.sm:hover{background:var(--info-bg)}

td .btn.danger.sm:hover{background:var(--bad-bg)}
td .tiny{font-size:11.5px}
tbody tr:hover td{background:var(--surface-2)}
td .in{min-height:30px;font-size:12.5px;padding:0 8px}

td.num,th.num{text-align:right;white-space:nowrap}
tr.flag td{background:var(--warn-bg)}
tr.tot td{font-weight:600;background:var(--surface-2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 12px}

.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--red)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}

/* shell */
.shell{display:flex;height:100%}
.side{flex:none;width:232px;font-size:13px;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;transition:width .18s ease;overflow-y:auto;overflow-x:hidden}
.shell.collapsed .side{width:72px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 12px 12px 16px;min-height:62px}
.stog{margin-left:auto;flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--brand-line);background:transparent;color:var(--brand-ink);cursor:pointer;opacity:.85}
.stog:hover{background:var(--brand-hi);opacity:1}
.shell.collapsed .brand{flex-direction:column;gap:10px;padding:14px 0 10px}
.shell.collapsed .stog{margin-left:0}
.mark{flex:none;width:36px;height:36px;border-radius:10px;background:#FFFFFF;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;letter-spacing:-.02em;position:relative}

.brand .t span{font-size:11.5px;color:var(--brand-muted);white-space:nowrap}
.ws{margin:0 12px 8px;padding:8px 10px;border-radius:10px;background:var(--brand-hi);font-size:11px;line-height:1.4;color:var(--brand-muted)}

.ws b::before{content:"";width:8px;height:8px;border-radius:50%;background:#3DDC84}
.grp{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-muted);padding:12px 22px 4px;white-space:nowrap}
.nav{display:flex;width:calc(100% - 20px);align-items:center;gap:10px;margin:1px 10px;padding:0 12px;min-height:36px;border-radius:8px;background:none;border:none;color:var(--brand-ink);opacity:.86;font-weight:500;font-size:13px;cursor:pointer;text-align:left;white-space:nowrap}
.nav:hover{background:var(--brand-hi);opacity:1}
.nav[aria-current="page"]{background:var(--red);color:var(--red-ink);opacity:1;font-weight:600}
.nav svg{flex:none}
.nav .bdg{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 6px}

.side .me{margin-top:auto;padding:14px 16px;border-top:1px solid var(--brand-line);display:flex;align-items:center;gap:10px}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand-hi);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.me .t b{display:block;font-size:12.5px;white-space:nowrap}
.me .t span{font-size:11px;color:var(--brand-muted)}
.side .av{width:30px;height:30px;font-size:11.5px}
.nav svg{width:17px;height:17px}
.shell.collapsed .lbl,.shell.collapsed .grp,.shell.collapsed .ws,.shell.collapsed .brand .t,.shell.collapsed .me .t,.shell.collapsed .nav .bdg{display:none}
.shell.collapsed .nav{justify-content:center;padding:0;margin:1px 14px;width:44px}
.mark.solid{background:var(--brand);color:#FFFFFF}
.mark.solid::after{border-color:var(--surface)}
.shell.collapsed .brand,.shell.collapsed .me{justify-content:center;padding-left:0;padding-right:0}
.shell.collapsed .grp-gap{height:14px}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg)}

.content{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.content>*{max-width:1320px;width:100%;margin-inline:auto}

/* login */
.login{min-height:100%;display:flex;flex-wrap:wrap;background:var(--surface)}
.login .l{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;padding:32px clamp(24px,4vw,56px);gap:24px}
.login .r{flex:1 1 460px;min-width:0;background:var(--brand);color:var(--brand-ink);padding:40px clamp(24px,5vw,80px);display:flex;flex-direction:column;justify-content:center;gap:24px}
.login .r>*{max-width:520px}
.page-scroll{height:100%;overflow-y:auto}
.login form{width:100%;max-width:400px;margin:auto;display:flex;flex-direction:column;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--btn)}
.found{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.preview{background:var(--surface);color:var(--fg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:420px;box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.modal.phone{max-width:390px}
.modal .hd{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal .bd{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
pre.file{margin:0;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font:12.5px/1.55 var(--mono);overflow:auto;max-height:280px;white-space:pre}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
/* v3 additions */
.chipf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--fg)}
.chipf b{font-weight:650}
.chipf[aria-pressed="true"]{border-color:var(--red);background:var(--bad-bg);color:var(--fg)}
.kpi.link{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.kpi.link:hover{border-color:var(--btn)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:55;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);display:flex;flex-direction:column}
.drawer .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.drawer .bd{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.drawer .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.chg{background:var(--warn-bg);border-radius:6px;padding:1px 6px}
.old{text-decoration:line-through;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--info-bg);color:var(--info);font-weight:600}
.wsw{margin:0 12px 8px;display:flex;gap:6px}
.wsw button{flex:1;border:1px solid var(--brand-line);background:transparent;color:var(--brand-ink);border-radius:8px;padding:5px 0;font-size:12px;cursor:pointer;opacity:.85}
.wsw button[aria-pressed="true"]{background:var(--red);border-color:var(--red);opacity:1;font-weight:600}
.shell.collapsed .wsw{display:none}
.tagtbc{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 6px;margin-left:6px}
.sbtn{display:flex;gap:8px;flex-wrap:wrap}
th.num{font-family:var(--sans)}
.nw{white-space:nowrap}
.top>div{min-width:0}.top h1,.top .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
</style>

<script>
(function(){

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function isHoliday(db,d){const w=pd(d).getDay();return w===0||w===6||db.holidays.some(h=>h.date===d)}
function adjust(db,d,rule){if(rule==='No adjustment')return d;let x=d,step=rule==='Previous working day'?-1:1,k=0;while(isHoliday(db,x)&&k<10){x=addD(x,step);k++}return x}
function yearDen(a,b){for(let y=+a.slice(0,4);y<=+b.slice(0,4);y++){if((y%4===0&&y%100!==0)||y%400===0){const f=y+'-02-29';if(f>a&&f<=b)return 366}}return 365}
function redOn(s,d){return (s.redSched||[]).filter(r=>r.date===d).reduce((a,r)=>a+r.amt,0)}
function fvAt(s,d){return r2(s.fv-(s.redSched||[]).filter(r=>r.date<=d).reduce((a,r)=>a+r.amt,0))}
function fvNow(s){return fvAt(s,TODAY)}
function schedule(db,s){
 if(!s.allot||!s.maturity)return[];
 if(s.freq==='Cumulative'){const c=s.comp==='Monthly'?12:4;const dd=days(s.allot,s.maturity);const ipn=r2(s.fv*(Math.pow(1+rateOn(s,s.maturity)/100/c,c*dd/365)-1));
  return[{nominal:s.maturity,start:s.allot,date:adjust(db,s.maturity,s.holidayRed),days:dd,den:365,fvp:s.fv,ipn,ppn:s.fv,type:'Interest + maturity',record:addD(s.maturity,-s.recDays)}]}
 const m=FREQ[s.freq]||1;const noms=[];let d=s.firstPayout||addM(s.allot,m);let k=0;
 while(d<s.maturity&&k<400){noms.push(d);d=addM(d,m);k++}noms.push(s.maturity);
 const list=noms.map((n,i)=>({nominal:n,start:i?noms[i-1]:s.allot}));
 if(s.broken==='second'&&list.length>1&&days(list[0].start,list[0].nominal)<days(list[1].start,list[1].nominal)){list[1].start=list[0].start;list.shift()}
 return list.map((e,i)=>{const last=i===list.length-1;
  const fvStart=r2(s.fv-(s.redSched||[]).filter(r=>r.date<=e.start).reduce((a,r)=>a+r.amt,0));
  const dd=days(e.start,e.nominal);const den=yearDen(e.start,e.nominal);
  const ipn=r2(fvStart*rateOn(s,e.nominal)/100*dd/den);
  const ppn=last?fvStart:redOn(s,e.nominal);
  const type=last?'Interest + maturity':ppn>0?'Interest + partial redemption':'Interest';
  const date=adjust(db,e.nominal,ppn>0?s.holidayRed:s.holidayInt);
  return {...e,date,days:dd,den,fvp:fvStart,ipn,ppn,type,record:addD(e.nominal,-s.recDays)}});
}
function nextPayoutOf(db,s){const e=schedule(db,s).find(x=>x.date>TODAY);return e?e.date:null}
function upcoming(db,s,n){return schedule(db,s).filter(x=>x.date>TODAY).slice(0,n)}
function rateOn(s,date){const h=(s.rateHist||[]).filter(r=>r.from<=date).sort((a,b)=>a.from<b.from?1:-1);return h.length?h[0].rate:(s.rateHist[0]||{}).rate}
const curRate=s=>rateOn(s,TODAY);

function ldcFor(db,pan,date){return db.ldc.find(l=>l.pan===pan&&l.from<=date&&l.to>=date&&l.used<l.limit)}
function f121Eligible(i){return i.res==='Resident'&&(i.invType==='Individual'||i.invType==='HUF')}
function tdsFor(db,inv,date,gross){
 const f=inv.pan&&db.f121[inv.pan];
 if(f&&f.status==='Verified'&&f.year===TAXYEAR&&f121Eligible(inv))return[0,'Form 121 verified · nil'];
 if(!inv.pan)return[db.tds.noPan,'No PAN · '+db.tds.noPan+'%'];
 const l=ldcFor(db,inv.pan,date);if(l)return[l.rate,'LDC · '+l.rate+'%'];
 if(inv.res==='NRI')return[db.tds.nri,'NRI · '+db.tds.nri+'%'];
 return[db.tds.resident,(inv.invType==='Company'?'Company':inv.invType==='HUF'?'HUF':'Resident')+' with PAN · '+db.tds.resident+'%'];
}
function modeFor(ifsc,amt){if(/^ICIC/.test(ifsc||''))return 'FUNDS_TRF';return amt>=RTGS_LIMIT?'AUTORTGS':'AUTONEFT'}
function periodFor(db,s,payout){return schedule(db,s).find(e=>e.date===payout)}
function calcLines(db,ids,payout){
 const lines=[];
 ids.forEach(sid=>{const s=db.series.find(x=>x.id===sid);const e=periodFor(db,s,payout);if(!e)return;const up=benposFor(db,sid,payout);
  db.investors.filter(i=>i.seriesId===sid&&i.ncds>0).forEach(i=>{
   const gross=r2(e.ipn*i.ncds);const principal=r2(e.ppn*i.ncds);
   const[tr,basis]=tdsFor(db,i,payout,gross);const tds=r2(gross*tr/100);const net=r2(gross-tds);const amount=r2(net+principal);
   const rtaNet=up&&up.rta?r2(Math.round(gross*(100-tr)*10)/1000):null;/* RTA method: net rounded on its own (as in the client's draft file) */
   lines.push({id:uid('ln'),invId:i.id,name:i.name,pan:i.pan,dpid:i.dpid,sid,units:i.ncds,fvp:e.fvp,days:e.days,den:e.den,rate:rateOn(s,e.nominal),ipn:e.ipn,ppn:e.ppn,gross,trate:tr,basis,tds,net,principal,amount,acct:i.acct,ifsc:i.ifsc,bankName:i.bankName,mode:modeFor(i.ifsc,amount),rtaNet,exc:(!i.acct||!i.ifsc)?'Bank details missing':''});
  })});
 return lines;
}
function totals(lines){const t={gross:0,tds:0,net:0,principal:0,amount:0,payable:0,n:lines.length,exc:0,excAmt:0,rtaDiff:0};lines.forEach(l=>{t.gross+=l.gross;t.tds+=l.tds;t.net+=l.net;t.principal+=l.principal||0;t.amount+=l.amount;if(l.exc){t.exc++;t.excAmt+=l.amount}else t.payable+=l.amount;if(l.rtaNet!=null&&Math.abs(l.rtaNet-l.net)>0.001)t.rtaDiff++});['gross','tds','net','principal','amount','payable','excAmt'].forEach(k=>t[k]=r2(t[k]));return t}
function benposFor(db,sid,payout){const s=db.series.find(x=>x.id===sid);const e=periodFor(db,s,payout);if(!e)return null;return db.uploads.find(u=>u.status==='Active'&&u.seriesIds.includes(sid)&&u.recordDate===e.record)}
function markChanged(sids,reason,db){db=db||DB();db.runs.forEach(r=>{if(['Draft','Returned','Pending'].includes(r.status)&&(sids==='all'||r.seriesIds.some(x=>sids.includes(x)))){if(!r.changed.includes(reason))r.changed.push(reason)}})}
function payoutOptions(db){const set={};db.series.filter(s=>s.status==='Active').forEach(s=>upcoming(db,s,3).forEach(e=>{set[e.date]=1}));return Object.keys(set).sort().slice(0,8)}
function runFor(db,sid,date){return db.runs.find(r=>r.payout===date&&r.seriesIds.includes(sid))}
function sstate(r,sid){r.sstate=r.sstate||{};return r.sstate[sid]||(r.sstate[sid]={})}
function runStatusFromSeries(r){if(!['Approved','File generated','Partly generated'].includes(r.status))return;const g=r.seriesIds.filter(s=>r.sstate&&r.sstate[s]&&r.sstate[s].file).length;r.status=g===0?'Approved':g<r.seriesIds.length?'Partly generated':'File generated'}

/* ================= approvals ================= */
function eligible(a,u){u=u||ME();const db=DB();if(a.status!=='Pending')return[false,''];const lvl=a.done.length+1;const p=permsOf(u);
 if(a.makerId===u.id)return[false,'You prepared this item'];
 if(a.done.some(d=>d.by===u.id))return[false,'You approved level '+(a.done.findIndex(d=>d.by===u.id)+1)];
 if(!p['approve'+lvl])return[false,'Needs "Approve — level '+lvl+'" permission'];
 if(a.type==='run'){const r=db.runs.find(x=>x.id===a.refId);if(r&&r.changed.length&&db.blockStale)return[false,'Run data changed — approval blocked by setting']}
 return[true,'']}
function createApproval(type,refId,title,summary,payload){
 const db=DB();const rule=db.rules[type];const u=ME();
 const a={id:uid('ap'),type,refId,title,summary,payload:payload||{},makerId:u.id,maker:u.name,levels:rule.levels,done:[],status:'Pending',at:stamp()};
 if(!rule.on){a.status='Approved';a.auto=true;applyApproval(db,a);db.approvals.unshift(a);audit(title+' applied (no approval rule)');return false}
 db.approvals.unshift(a);audit('Sent for approval: '+title);return true}
function applyApproval(db,a){const p=a.payload;
 if(a.type==='series'){const s=db.series.find(x=>x.id===a.refId);if(!s)return;
  if(p.kind==='create'){s.status='Active'}
  if(p.kind==='change'){p.changes.forEach(c=>{if(c.key==='rate'){s.rateHist.push({rate:+c.new,from:p.from||TODAY})}else s[c.key]=c.key==='recDays'?+c.new:c.key==='accountId'?c.raw:c.new;
    s.changes.unshift({field:c.label,old:c.old,new:c.new,from:p.from||'Next unapproved run',reason:p.reason,by:a.maker,approvedBy:a.done.map(d=>d.name).join(', ')||'—',at:stamp()})});s.pending=null;markChanged([s.id],'Series terms changed',db)}
  if(p.kind==='close'){s.status='Closed';s.pending=null}}
 if(a.type==='run'){const r=db.runs.find(x=>x.id===a.refId);if(r){r.status='Approved';r.changed=[];r.lines.forEach(l=>{if(l.basis.startsWith('LDC')){const L=db.ldc.find(x=>x.pan===l.pan);if(L)L.used=r2(L.used+l.gross)}});r.uploadIds.forEach(id=>{const u=db.uploads.find(x=>x.id===id);if(u)u.usedBy=r.code})}}
 if(a.type==='bank'){const i=db.investors.find(x=>x.id===a.refId);if(i){db.investors.filter(x=>x.pan&&x.pan===i.pan||x.id===i.id).forEach(x=>{x.acct=p.acct;x.ifsc=p.ifsc;x.issue='';x.bankPending=false});markChanged('all','Investor bank details changed',db)}}
 if(a.type==='resend'){const r=db.runs.find(x=>x.id===p.runId);const i=db.investors.find(x=>x.id===p.invId);
  if(i&&p.acct){db.investors.filter(x=>x.pan&&x.pan===i.pan||x.id===i.id).forEach(x=>{x.acct=p.acct;x.ifsc=p.ifsc;x.issue='';x.bankPending=false})}
  if(r){const l=r.lines.find(x=>x.id===p.lineId);if(p.acct){l.acct=p.acct;l.ifsc=p.ifsc}else if(i){l.acct=i.acct;l.ifsc=i.ifsc}l.mode=modeFor(l.ifsc,l.amount);
   const pm=r.payments[l.id]||(r.payments[l.id]={status:'Exception',attempts:0,history:[]});pm.status='Queued';pm.attempts=(pm.attempts||0)+1;pm.reason='';pm.history.push({at:stamp(),what:'Queued for resend (attempt '+pm.attempts+')'});l.exc=''}}
 if(a.type==='manual'){const r=db.runs.find(x=>x.id===p.runId);if(r){const pm=r.payments[p.lineId]||(r.payments[p.lineId]={attempts:0,history:[]});pm.status=p.status;pm.utr=p.status==='Paid'?p.ref:'';pm.reason=p.status==='Unpaid'?p.ref:'';pm.history.push({at:stamp(),what:'Manual update: '+p.status+' ('+p.ref+')'});const l=r.lines.find(x=>x.id===p.lineId);if(l&&p.status==='Paid')l.exc='';updateRunPaid(r)}}
 if(a.type==='tds'){db.tds[p.key]=p.value;markChanged('all','TDS rate changed',db)}
 if(a.type==='account'){const ac=db.accounts.find(x=>x.id===a.refId);if(ac)ac.status='Active'}
 if(a.type==='redemption'){const s=db.series.find(x=>x.id===a.refId);const rd=db.redemptions.find(x=>x.id===p.redId);if(rd)rd.status='Applied';
  if(s){if(p.kind==='Full'){s.redSched=(s.redSched||[]).filter(x=>x.date<p.date);s.maturity=p.date}else{s.redSched=(s.redSched||[]).concat([{date:p.date,amt:p.amt,unscheduled:true}]).sort((x,y)=>x.date<y.date?-1:1)}markChanged([s.id],'Redemption applied',db)}}
}
function undoPending(db,a,status){const p=a.payload;
 if(a.type==='series'){const s=db.series.find(x=>x.id===a.refId);if(s){if(p.kind==='create')s.status=status==='Rejected'?'Returned':'Draft';s.pending=null;if(status==='Rejected')s.returnReason=a.reason}}
 if(a.type==='run'){const r=db.runs.find(x=>x.id===a.refId);if(r){r.status=status==='Rejected'?'Returned':'Draft';r.reason=a.reason||''}}
 if(a.type==='bank'){const i=db.investors.find(x=>x.id===a.refId);if(i)i.bankPending=false}
 if(a.type==='resend'){const r=db.runs.find(x=>x.id===p.runId);if(r){const pm=r.payments[p.lineId];if(pm)pm.status=pm.prev||'Unpaid'}}
 if(a.type==='account'){db.accounts=db.accounts.filter(x=>x.id!==a.refId)}
 if(a.type==='redemption'){const rd=db.redemptions.find(x=>x.id===p.redId);if(rd)rd.status=status}
}
function pendingFor(db,u){db=db||DB();u=u||ME();return db.approvals.filter(a=>eligibleFor(db,a,u)).length}
function eligibleFor(db,a,u){if(a.status!=='Pending')return false;const lvl=a.done.length+1;const p=permsOf(u,db);if(a.makerId===u.id||a.done.some(d=>d.by===u.id)||!p['approve'+lvl])return false;if(a.type==='run'){const r=db.runs.find(x=>x.id===a.refId);if(r&&r.changed.length&&db.blockStale)return false}return true}
function updateRunPaid(r){const all=r.lines.every(l=>{const pm=r.payments[l.id];return pm&&pm.status==='Paid'});if(all)r.status='Paid';else if(Object.values(r.payments).some(p=>p.status==='Paid'))r.status='Partly paid'}

function balanceGroups(db){
 /* one group per series per payout date: each series pays from its own distribution account */
 const g=[];
 db.runs.filter(r=>['Approved','Partly generated'].includes(r.status)).forEach(r=>r.seriesIds.forEach(sid=>{const st=(r.sstate||{})[sid]||{};if(st.file)return;const s=db.series.find(x=>x.id===sid)||{};
  g.push({sid,run:r,runs:[r],date:r.payout,acc:s.accountId,need:totals(r.lines.filter(l=>l.sid===sid)).payable,bal:db.balances[balKey(sid,r.payout)]})}));
 return g.sort((a,b)=>a.date<b.date?-1:1)}
function balState(x){return x.bal==null?'none':x.bal<x.need?'short':'ok'}
function attention(db){
 const out=[];
 db.runs.filter(r=>r.status==='Returned').forEach(r=>out.push(['interest','Run '+r.code+' was returned: '+(r.reason||'see reason'),'run',r.id]));
 db.runs.filter(r=>['Draft','Pending'].includes(r.status)&&r.changed.length).forEach(r=>out.push(['interest','Run '+r.code+' — data changed, recalculate','run',r.id]));
 db.runs.filter(r=>r.status==='Draft'&&!r.changed.length).forEach(r=>out.push(['interest','Run '+r.code+' is a draft — submit for approval','run',r.id]));
 db.series.filter(s=>s.status==='Active'&&s.freq!=='Cumulative').forEach(s=>{const e=upcoming(db,s,1)[0];if(e&&days(TODAY,e.date)<=30&&!benposFor(db,s.id,e.date)&&!runFor(db,s.id,e.date))out.push(['investors','Upload BenPos for '+s.name+' (record date '+fd(e.record)+')'])});
 const sub=Object.values(db.f121).filter(f=>f.status==='Submitted').length;if(sub)out.push(['form121',sub+' Form 121 submission'+(sub>1?'s':'')+' to verify']);
 const fl=db.investors.filter(i=>flagOf(i)).length;if(fl)out.push(['investors',fl+' holding'+(fl>1?'s':'')+' with missing PAN or bank details']);
 let unpaid=0,exc=0;db.runs.forEach(r=>Object.values(r.payments||{}).forEach(p=>{if(p.status==='Unpaid')unpaid++;if(p.status==='Exception')exc++}));
 if(unpaid)out.push(['confirmation',unpaid+' unpaid payment'+(unpaid>1?'s':'')+' to correct & resend']);
 if(exc)out.push(['confirmation',exc+' exception'+(exc>1?'s':'')+' waiting for bank details']);
 db.runs.filter(r=>['Approved','Partly generated'].includes(r.status)).forEach(r=>out.push(['processing','Run '+r.code+' approved — check each series balance and generate its bank file']));
 db.series.filter(s=>['Active','Draft','Pending approval'].includes(s.status)&&!s.accountId).forEach(s=>out.push(['series',s.name+' has no distribution account']));
 return out}

 const row=(label,k)=>{const x=m[k];return label.padEnd(26)+(x?String(x.n).padStart(6)+inr(x.gross).padStart(18)+inr(x.tds).padStart(16)+inr(x.amt).padStart(18):'     -                 -               -                 -')};
 return fd(TODAY)+'\n\nTo,\nICICI Bank Ltd\n\nSub: Certification and details of '+(t.principal?'Interest and Redemption':'Interest')+' payment transactions to be made on '+fd(r.payout)+'\n\nRef.: '+db.full+' - NCD '+s.name+' Distribution Account; Account No. – '+ac.acct+'\n\nDear Sir,\n\nWe are pleased to provide the following details for your kind consideration:\n\nName of the Issue:       '+db.full+' – '+s.name+' ('+s.isin+')\nAccount no:              '+ac.acct+'\nPayment due on:          '+fd(r.payout)+'\n\nThe master list of debenture holders as on '+fd(e.record)+' (record date) submitted to ICICI Bank is accurate and has been verified by the Company.\n\nWe further confirm that the number of transactions and amounts to be processed by ICICI Bank are as below:\n\nMODE OF PAYMENT            NO.       GROSS (Rs)       TDS (Rs)      NET (Rs)\nWarrants / Demand Drafts       -                 -               -                 -\nNECS (NACH)                    -                 -               -                 -\n'+row('Direct Credits','FUNDS_TRF')+'\n'+row('RTGS','AUTORTGS')+'\n'+row('NEFT','AUTONEFT')+'\nTOTAL                     '+String(t.n).padStart(6)+inr(t.gross).padStart(18)+inr(t.tds).padStart(16)+inr(t.payable).padStart(18)+(t.principal?'\n(Net includes principal of '+inr(t.principal)+')':'')+'\n\nYou are requested to take the same on record and do the needful at the earliest.\n\nThanking you\nYours faithfully,\nFor '+db.full+'\n\n[Authorised signatory]\nChief Financial Officer'}
function indemnityText(db,sid){const s=ser(sid);const ac=acctOf(s);return fd(TODAY)+'\n\nTo,\nICICI Bank Ltd,\n\nSub: Undertaking cum Indemnity for Interest Processing Basis Email Confirmation\n\nRef.: '+db.full+' - NCD '+s.name+' Distribution Account; Account No. – '+ac.acct+'\n\nWe, '+db.full+', certify that the Interest Payment Files shared by us over email are true and accurate to the best of our knowledge. The files have been shared over email because no RTA is involved in the process of payment of the interest.\n\nNCD under '+s.name+' (ISIN: '+s.isin+') shall mature on '+fd(s.maturity)+'. They bear a coupon rate payable '+s.freq.toLowerCase()+((s.redSched||[]).length?' and partial redemption of face value as per the redemption schedule':'')+'.\n\nWe hereby agree, confirm and undertake to indemnify, defend and hold harmless ICICI Bank … for acting basis the email instructions shared.\n\nYours faithfully,\nFor '+db.full+'\n\n[Company Secretary & Compliance Officer]'}
const BANK_COLS=['Payment_Product_Code','Beneficiary_Account_No','Pay_To','R2C1','Instrument_Amount','Credit_Narration','Payment_Instruction_Date','R1C1','Folio_No','R145C1','R146C1','R148C1','IFSC_CODE','BENE_LEI','R149C1','R150C1','Beneficiary_Bank_Code'];

function reportData(db,k){

 if(k==='summary')return{head:['Run','Payment date','Series','#Holdings','#Gross','#TDS','#Net interest','#Principal','#Paid','#Unpaid','#Exceptions','Status'],rows:db.runs.filter(r=>okS(r.seriesIds)).map(r=>{const t=totals(r.lines);const P=Object.values(r.payments||{});return [r.code,fd(r.payout),r.seriesIds.map(s=>ser(s).name).join(' / '),t.n,inr(t.gross),inr(t.tds),inr(t.net),inr(t.principal),P.filter(p=>p.status==='Paid').length,P.filter(p=>p.status==='Unpaid').length,t.exc,runSt(r.status)]})};
 if(k==='status'){const rows=[];db.runs.forEach(r=>r.lines.forEach(l=>{if(!okS([l.sid]))return;const p=(r.payments||{})[l.id];if(!p)return;rows.push([l.name,l.pan||'—',l.dpid,ser(l.sid).name,r.code,MODES[l.mode]||'—',inr(l.amount),acctMask(l.acct),p.utr||'—',p.status,p.reason||'',p.attempts||0])}));return{head:['Investor','PAN','DP/Client ID','Series','Run','Mode','#Amount','Account','UTR / reference','Status','Reason','#Attempts'],rows}}
 if(k==='redemption'){const rows=[];db.series.filter(s=>okS([s.id])).forEach(s=>schedule(db,s).filter(e=>e.ppn>0).forEach(e=>{const rr=runFor(db,s.id,e.date);rows.push([s.name,e.type==='Interest + maturity'?'Final':'Partial',inr(e.ppn),fd(e.date),inr(r2(e.fvp-e.ppn)),e.date<=TODAY?'Paid':rr?runSt(rr.status):'Upcoming'])}));return{head:['Series','Type','#Per NCD','Payment date','#FV after','Status'],rows}}
 if(k==='exception'){const rows=[];db.runs.forEach(r=>r.lines.forEach(l=>{if(!okS([l.sid]))return;const p=(r.payments||{})[l.id];const was=l.exc||(p&&(p.status==='Exception'||p.status==='Unpaid'||p.attempts>1));if(!was)return;rows.push([l.name,l.pan||'—',ser(l.sid).name,r.code,l.exc||(p&&p.reason)||'Resent',p?(p.status==='Paid'?'Paid':p.status==='Queued'?'Fixed':'Open'):'Open'])}));return{head:['Investor','PAN','Series','Run','Reason','Current status'],rows}}
}

A.apApprove=d=>{const db=DB();const a=db.approvals.find(x=>x.id===d.id);const[ok,why]=eligible(a);if(!ok)return toast(why);const r=approveOne(db,a);UI.drawer=null;done(r==='final'?a.title+' approved and applied':'Level '+a.done.length+' approved · waiting for level '+(a.done.length+1))};
A.apBulk=()=>{const db=DB();const sel=UI.sel.ap||{};let n=0;const skip=[];Object.keys(sel).filter(k=>sel[k]).forEach(k=>{const a=db.approvals.find(x=>x.id===k);if(!a)return;const[ok,why]=eligible(a);if(ok){approveOne(db,a);n++}else skip.push(a.title+': '+why)});UI.sel.ap={};done(n+' approved'+(skip.length?' · skipped '+skip.length+' ('+skip[0]+')':''))};
A.apReject=d=>{const a=DB().approvals.find(x=>x.id===d.id);UI.modal={type:'reject',id:d.id,title:a.title};render()};
A.rejectGo=()=>{const db=DB();const m=UI.modal;const r=val('rj-r');if(!r){m.err='A reason is required.';return render()}const a=db.approvals.find(x=>x.id===m.id);a.status='Rejected';a.reason=r;a.rejBy=ME().name;undoPending(db,a,'Rejected');audit('Rejected '+a.title+': '+r);UI.modal=null;UI.drawer=null;done('Returned to '+a.maker+' with your reason')};
A.apWithdraw=d=>{const db=DB();const a=db.approvals.find(x=>x.id===d.id);if(a.done.length)return toast('Already approved at level 1 — can\'t withdraw.');a.status='Withdrawn';undoPending(db,a,'Withdrawn');audit('Withdrew '+a.title);UI.drawer=null;done('Withdrawn')};

/* payment processing — per series */
A.balSave=d=>{const db=DB();const v=parseFloat(val('bal-'+d.run+d.sid).replace(/[^0-9.]/g,''));if(!(v>=0))return toast('Enter the balance in rupees.');db.balances[balKey(d.sid,d.date)]=v;audit('Entered '+ser(d.sid).name+' account balance '+inr(v)+' for '+fd(d.date));done('Balance saved')};
A.fileGenAsk=d=>{UI.modal={type:'genAsk',runId:d.id,sid:d.sid};render()};
A.fileGen=d=>{const db=DB();const r=db.runs.find(x=>x.id===d.id);const sid=d.sid;const ls=r.lines.filter(l=>l.sid===sid);const need=totals(ls).payable;const bal=db.balances[balKey(sid,r.payout)];
 if(bal==null||bal<need){UI.modal=null;return done('The balance must cover this series first.')}
 const st=sstate(r,sid);if(st.file){UI.modal=null;return done('This bank file was already generated.')}
 const pay=ls.filter(l=>!l.exc);st.file=bankFile(db,r,pay);st.by=ME().name;st.at=stamp();st.name=db.code+'_'+ser(sid).name.replace(/\s/g,'')+'_'+r.payout.replace(/-/g,'')+'.xls';
 ls.forEach(l=>{r.payments[l.id]=l.exc?{status:'Exception',attempts:0,history:[{at:stamp(),what:'Kept out of file: '+l.exc}]}:{status:'Awaiting bank',attempts:1,history:[{at:stamp(),what:'In bank file '+st.name}]}});
 runStatusFromSeries(r);audit('Generated bank file '+st.name+' ('+pay.length+' payments, '+inr(need)+')');UI.modal={type:'file',title:'Bank file · '+st.name,text:st.file,note:'ICICI bulk-upload format (tab-separated here; .xls in the live product), no password. Generated once; you can download it again from this screen.'};done('Bank file generated')};
A.fileView=d=>{const r=DB().runs.find(x=>x.id===d.id);const st=sstate(r,d.sid);UI.modal={type:'file',title:'Bank file · '+st.name,text:st.file};render()};
A.undertaking=d=>{UI.modal={type:'undertaking',runId:d.id,sid:d.sid};render()};
A.indemnity=d=>{UI.modal={type:'indemnity',runId:d.id,sid:d.sid};render()};
A.undSave=()=>{const db=DB();const m=UI.modal;const r=db.runs.find(x=>x.id===m.runId);sstate(r,m.sid).cert=$('#copytext').value;audit('Edited Certificate Undertaking for '+ser(m.sid).name+' in run '+r.code);done('Undertaking saved')};
A.goConf=d=>{UI.page='confirmation';UI.sel.conf=d.id;render()};

/* payment confirmation — ICICI files per mode, matched on DP/Client ID + amount */
C.confRun=e=>{UI.sel.conf=e.target.value;UI.f.confRes=null;render()};
A.confUpload=()=>{const db=DB();const r=db.runs.find(x=>x.id===UI.sel.conf);const awaiting=r.lines.filter(l=>r.payments[l.id]&&r.payments[l.id].status==='Awaiting bank');
 if(!awaiting.length)return toast('No payments are waiting for the bank in this run.');
 const n=(r.confN||0)+1;r.confN=n;const files=[];const ambRows=[];const now=new Date();const ts=String(now.getHours()).padStart(2,'0')+'.'+String(now.getMinutes()).padStart(2,'0');
 Object.keys(MODES).forEach(mode=>{const ls=awaiting.filter(l=>l.mode===mode);if(!ls.length)return;const bySeries={};ls.forEach(l=>{(bySeries[l.sid]=bySeries[l.sid]||[]).push(l)});
  Object.keys(bySeries).forEach(sid=>{let paid=0,cancelled=0;
   bySeries[sid].forEach((l,k)=>{const i=db.investors.find(x=>x.id===l.invId);const p=r.payments[l.id];
    /* match: DP/Client ID + amount (bank returns zero-padded account numbers, so account is not used) */
    const fail=i&&i.issue&&p.attempts===1;
    if(fail){p.status='Unpaid';p.reason=i.issue+' (RBI Rejection · Cancelled)';cancelled++;p.history.push({at:stamp(),what:'ICICI '+MODES[mode]+': Cancelled — '+i.issue})}
    else{p.status='Paid';p.paidOn=fd(r.payout<TODAY?r.payout:TODAY);p.utr=mode==='AUTORTGS'?'ICICR2'+r.payout.replace(/-/g,'')+String(19059900+k):mode==='AUTONEFT'?'IN2262732913'+String(1000+k):'LOG_Q '+String(2019093000+k*10);paid++;p.history.push({at:stamp(),what:'ICICI '+MODES[mode]+': Paid · '+p.utr})}});
   const ac=acctOf(ser(sid));files.push({name:MODES[mode].toUpperCase().replace(' ','_')+'_'+ser(sid).name.replace(/\s/g,'')+'_'+n+'.xls',mode:MODES[mode],series:ser(sid).name+' ('+ac.acct+')',rows:bySeries[sid].length+(mode==='AUTONEFT'&&!ambRows.length?1:0),paid,cancelled,unmatched:mode==='AUTONEFT'&&!ambRows.length?1:0});
   if(mode==='AUTONEFT'&&!ambRows.length)ambRows.push({dpid:'1208160099990001',amt:593.62,why:'no payment in this run with this DP/Client ID and amount'})})});
 updateRunPaid(r);const P=Object.values(r.payments);audit('Uploaded ICICI confirmation set '+n+' for run '+r.code+': '+files.map(f=>f.mode+' '+f.paid+' paid / '+f.cancelled+' cancelled').join(', '));
 UI.f.confRes={run:r.id,n,files,ambRows};done(P.filter(p=>p.status==='Paid').length+' paid · '+P.filter(p=>p.status==='Unpaid').length+' unpaid · investors notified')};
A.resendAsk=d=>{UI.modal={type:'resend',runId:d.run,lineId:d.line,exc:!!d.exc};render()};
A.resendSubmit=()=>{const db=DB();const m=UI.modal;const r=db.runs.find(x=>x.id===m.runId);const l=r.lines.find(x=>x.id===m.lineId);const a=val('bk-a'),f=val('bk-i').toUpperCase();
 const e=bankErr(a,f);if(e){m.err=e;return render()}if(!hasFile('bk-p')){m.err='Upload proof (cancelled cheque or bank letter).';return render()}
 const p=r.payments[l.id];if(p.attempts>=db.sys.maxRetries&&!m.exc){m.err='Retry limit reached ('+db.sys.maxRetries+').';return render()}p.prev=p.status;
 const pend=createApproval('resend',l.id,(m.exc?'Queue fixed exception · ':'Resend · ')+l.name,[['Run',r.code],['Series',ser(l.sid).name],['Investor',l.name],['DP/Client ID',l.dpid],['Amount',inr(l.amount)],['Account',a,l.acct||'—'],['IFSC',f,l.ifsc||'—'],['Reason',p.reason||l.exc||'—'],['Proof','Attached']],{runId:r.id,lineId:l.id,invId:l.invId,acct:a,ifsc:f});
 UI.modal=null;done(pend?'Sent for approval':'Queued for the resend file')};
A.manualAsk=d=>{UI.modal={type:'manual',runId:d.run,lineId:d.line};render()};
A.manualSubmit=()=>{const db=DB();const m=UI.modal;const r=db.runs.find(x=>x.id===m.runId);const l=r.lines.find(x=>x.id===m.lineId);const st=val('mn-s'),ref=val('mn-r');
 if(!ref){m.err='Enter the UTR, cheque number or reason.';return render()}if(!hasFile('mn-p')){m.err='Upload proof.';return render()}
 const pend=createApproval('manual',l.id,'Manual status · '+l.name+' → '+st,[['Run',r.code],['Investor',l.name],['Amount',inr(l.amount)],['New status',st],['Reference',ref],['Proof','Attached']],{runId:r.id,lineId:l.id,status:st,ref});
 UI.modal=null;done(pend?'Sent for approval':'Status updated')};
A.rbalSave=d=>{const db=DB();const v=parseFloat(val('rbal-'+d.sid).replace(/[^0-9.]/g,''));if(!(v>=0))return toast('Enter the balance in rupees.');db.balances[balKey(d.sid,'resend-'+d.id)]=v;audit('Entered '+ser(d.sid).name+' account balance '+inr(v)+' for a resend file');done('Balance saved')};
A.resendGen=d=>{const db=DB();const r=db.runs.find(x=>x.id===d.id);const q=r.lines.filter(l=>l.sid===d.sid&&r.payments[l.id]&&r.payments[l.id].status==='Queued');const amt=r2(q.reduce((a,l)=>a+l.amount,0));const k=balKey(d.sid,'resend-'+r.id);const bal=db.balances[k];
 if(bal==null||bal<amt)return toast('Balance must cover the resend file.');
 const name=db.code+'_'+ser(d.sid).name.replace(/\s/g,'')+'_'+r.payout.replace(/-/g,'')+'_resend'+((r.resendFiles||[]).length+1)+'.xls';const text=bankFile(db,r,q,'RESEND');r.resendFiles.push({name,sid:d.sid,n:q.length,amt,at:stamp(),text});
 q.forEach(l=>{const p=r.payments[l.id];p.status='Awaiting bank';p.history.push({at:stamp(),what:'In resend file '+name})});delete db.balances[k];
 audit('Generated resend file '+name+' ('+q.length+' payments, '+inr(amt)+')');UI.modal={type:'file',title:name,text};done('Resend file generated')};
A.resendView=d=>{const r=DB().runs.find(x=>x.id===d.id);const f=r.resendFiles[+d.i];UI.modal={type:'file',title:f.name,text:f.text};render()};

/* redemption (unscheduled) */
C.redS=e=>{UI.f.red={...(UI.f.red||{}),sid:e.target.value};render()};
C.redK=e=>{UI.f.red={...(UI.f.red||{}),kind:e.target.value};render()};
A.redSubmit=()=>{const db=DB();const sid=val('rd-s'),kind=val('rd-k'),date=val('rd-d'),reason=val('rd-r');const s=db.series.find(x=>x.id===sid);
 const err=m=>{UI.f.red={sid,kind,date,reason,amt:val('rd-a')};UI.f.redErr=m;render()};
 const e=schedule(db,s).find(x=>x.nominal===date);if(!date||date<TODAY||!e)return err('Choose a future interest date of this series ('+upcoming(db,s,3).map(x=>fd(x.nominal)).join(', ')+'…).');
 const out=e.fvp-(e.ppn&&e.type!=='Interest + maturity'?e.ppn:0);const amt=kind==='Full'?out:parseFloat(val('rd-a'));
 if(!(amt>0))return err('Enter the amount redeemed per NCD.');if(kind==='Partial'&&amt>=out)return err('A partial amount must be less than the outstanding face value on that date ('+inr(out)+'). Choose Full instead.');
 if(!reason)return err('Enter a reason or board / trustee reference.');
 if(db.redemptions.some(r=>r.sid===sid&&r.status==='Pending'))return err('A redemption for this series is already waiting for approval.');
 const ncds=db.investors.filter(i=>i.seriesId===sid).reduce((a,i)=>a+i.ncds,0);
 const rd={id:uid('rd'),sid,kind,amt,date,total:r2(amt*ncds),reason,by:ME().name,status:'Pending'};db.redemptions.push(rd);
 const pend=createApproval('redemption',sid,kind+' redemption · '+s.name,[['Series',s.name],['Type',kind+' (unscheduled)'],['Per NCD',inr(amt)],['Date',fd(date)],['Principal repaid',inr(rd.total)],['Face value after',inr(kind==='Full'?0:out-amt),inr(out)],['Reason',reason]],{redId:rd.id,kind,amt,date});
 UI.f.red=null;UI.f.redErr='';done(pend?'Redemption sent for approval':'Redemption applied')};

/* reports */
C.rpS=e=>{UI.f.rpS=e.target.value;render()};
C.auU=e=>{UI.f.auU=e.target.value;render()};
A.reportExport=d=>{const db=DB();let text;
 if(d.k==='audit')text='WHEN,WHO,ACTION\n'+db.audit.map(a=>[a.at,a.by,a.act].map(csvCell).join(',')).join('\n');
 else{const r=reportData(db,d.k);text=r.head.map(h=>h.replace('#','')).join(',')+'\n'+r.rows.map(x=>x.map(csvCell).join(',')).join('\n')}
 audit('Exported '+d.k+' report');UI.modal={type:'file',title:'Export · '+d.k,text,note:'Format TBC (Excel / CSV / PDF).'};done()};

/* settings */
C.userRole=e=>{const db=DB();const u=db.users.find(x=>x.id===e.target.dataset.id);const old=u.role;u.role=e.target.value;audit('Changed role of '+u.name+': '+old+' → '+u.role);done('Role updated')};
A.userToggle=d=>{const db=DB();const u=db.users.find(x=>x.id===d.id);if(u.id===ME().id)return toast('You can\'t deactivate your own account.');u.active=!u.active;audit((u.active?'Activated ':'Deactivated ')+u.name);done(u.name+(u.active?' activated':' deactivated'))};
A.userAdd=()=>{const db=DB();const n=val('nu-n'),p=val('nu-p').replace(/\D/g,''),r=val('nu-r');const err=m=>{UI.f.nuErr=m;render()};
 if(!n)return err('Enter a name.');if(p.length!==10)return err('Enter a 10-digit mobile number.');
 if(S.supers.some(x=>x.phone===p))return err('This number belongs to a Super Admin.');
 for(const c of Object.keys(S.dbs)){const u=S.dbs[c].users.find(x=>x.phone===p);if(u){if(c===db.code)return err('This number is already registered in '+c+'.');if(u.active)return err('This number is already registered with '+c+'. A number can belong to one company only.')}}
 db.users.push({id:uid('u'),name:n,phone:p,role:r,active:true});audit('Added user '+n+' (+91 '+mask(p)+') as '+r);UI.f.nuErr='';done(n+' can now sign in to '+db.code)};
A.roleAdd=()=>{const db=DB();const n=val('nr-n');if(!n){UI.f.nrErr='Enter a role name.';return render()}if(Object.keys(db.roles).some(r=>r.toLowerCase()===n.toLowerCase())){UI.f.nrErr='That role already exists.';return render()}db.roles[n]={};audit('Created role '+n);UI.f.nrErr='';done('Role '+n+' created · tick its permissions')};
C.perm=e=>{const d=e.target.dataset;const r=DB().roles[d.role];if(e.target.checked)r[d.perm]=1;else delete r[d.perm];audit((e.target.checked?'Granted "':'Removed "')+(PERMS.find(p=>p[0]===d.perm)||[])[1]+'" for role '+d.role);done()};
C.ruleOn=e=>{const k=e.target.dataset.k;DB().rules[k].on=e.target.checked;audit('Approval rule "'+typeName(k)+'": '+(e.target.checked?'on':'off'));done()};
C.ruleLv=e=>{const k=e.target.dataset.k;const old=DB().rules[k].levels;DB().rules[k].levels=parseInt(e.target.value,10);audit('Approval levels "'+typeName(k)+'": '+old+' → '+e.target.value);done()};
C.blockStale=e=>{DB().blockStale=e.target.checked;audit('Block approval of changed runs: '+(e.target.checked?'on':'off'));done()};
A.tdsAsk=d=>{UI.modal={type:'tds',key:d.k,label:d.l};render()};
A.tdsSubmit=()=>{const db=DB();const m=UI.modal;const v=parseFloat(val('td-v')),r=val('td-r');
 if(!(v>=0&&v<=100)){m.err='Enter a rate between 0 and 100.';return render()}if(!r){m.err='A reason is required.';return render()}
 if(v===db.tds[m.key]){m.err='That is the current rate.';return render()}
 const pend=createApproval('tds',m.key,'TDS rate change · '+m.label,[['Investor type',m.label],['Rate',v+'%',db.tds[m.key]+'%'],['Reason',r]],{key:m.key,value:v});
 db.audit[0].act='TDS rate change '+m.label+': '+db.tds[m.key]+'% → '+v+'% ('+(pend?'sent for approval':'applied')+')';UI.modal=null;done(pend?'Sent for approval':'Rate updated')};
A.accAdd=()=>{const db=DB();const l=val('pa-l'),b=val('pa-b'),a=val('pa-a'),i=val('pa-i').toUpperCase();const err=m=>{UI.f.paErr=m;render()};
 if(!l||!b)return err('Enter a label and bank.');const e=bankErr(a,i);if(e)return err(e);if(db.accounts.some(x=>x.acct===a))return err('This account is already set up.');
 const ac={id:uid('ac'),label:l,bank:b,acct:a,ifsc:i,status:'Pending'};db.accounts.push(ac);
 const pend=createApproval('account',ac.id,'Payout account · '+l,[['Label',l],['Bank',b],['Account',a],['IFSC',i]],{});UI.f.paErr='';done(pend?'Sent for approval':'Account added')};
A.holAdd=()=>{const db=DB();const d=val('ho-d'),n=val('ho-n');if(!d||!n){UI.f.hoErr='Enter a date and name.';return render()}if(db.holidays.some(h=>h.date===d)){UI.f.hoErr='This date is already a holiday.';return render()}
 db.holidays.push({date:d,name:n});markChanged('all','Holiday calendar changed');audit('Added holiday '+n+' on '+fd(d));UI.f.hoErr='';done('Holiday added')};
A.sysSave=()=>{const db=DB();const F=[['otpMin',1,15,'OTP validity'],['otpTries',1,10,'Wrong OTP attempts'],['lockMin',5,120,'Lockout duration'],['resendSec',10,300,'Resend wait'],['maxResends',1,10,'Max resends'],['sessionMin',5,120,'Session timeout'],['maxRetries',1,10,'Maximum payment retries']];
 const nv={};for(const f of F){const v=parseInt(val('sy-'+f[0]),10);if(!(v>=f[1]&&v<=f[2])){UI.f.syErr=f[3]+' must be between '+f[1]+' and '+f[2]+'.';return render()}nv[f[0]]=v}nv.f121Reset=chk('sy-f121Reset');
 const ch=Object.keys(nv).filter(k=>db.sys[k]!==nv[k]);ch.forEach(k=>audit('System setting '+k+': '+db.sys[k]+' → '+nv[k]));Object.assign(db.sys,nv);UI.f.syErr='';done(ch.length?'Settings saved':'No changes')};

/* ================= events ================= */
document.addEventListener('click',e=>{UI.lastAct=Date.now();const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=A[el.dataset.act];if(!fn)return;if(el.dataset.act!=='scrim')e.preventDefault();fn(el.dataset,el,e)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.chg;if(k==='iS'){UI.f.iS=e.target.value;return render()}if(k==='iF'){UI.f.iF=e.target.checked;return render()}if(k==='upS'){UI.f.upS=e.target.value;return render()}if(k&&C[k])C[k](e)});
document.addEventListener('submit',e=>{e.preventDefault();const k=e.target.dataset.submit;if(k&&A[k])A[k]({},e.target,e)});
let inpT;document.addEventListener('input',e=>{UI.lastAct=Date.now();const t=e.target;
 const k=t.dataset&&t.dataset.inp;if(k){UI.f[k]=t.value;clearTimeout(inpT);inpT=setTimeout(()=>{UI.restore=t.id;render()},180);return}
 const form=t.closest&&t.closest('[data-live="sf"]');if(form){const f=readSF();const p=$('#sprev');if(p)p.innerHTML=schedPreview(f);if(t.id==='sf-freq'||t.id==='sf-redType'){UI.f.sf=f;render()}}});
document.addEventListener('keydown',e=>{UI.lastAct=Date.now();if(e.key==='Escape'){if(UI.modal){UI.modal=null;render()}else if(UI.drawer){UI.drawer=null;render()}}});
setInterval(()=>{if(!S.session)return;const mins=DB().sys.sessionMin,lim=mins*60000;if(Date.now()-UI.lastAct>lim){audit('Signed out after inactivity');S.session=null;UI.modal=null;UI.drawer=null;UI.login={phone:'',step:'phone',err:'',info:'You were signed out after '+mins+' minutes of inactivity. Sign in again.'};save();render()}},15000);
window.addEventListener('resize',()=>{if(window.innerWidth<720&&!UI.collapsed){UI.collapsed=true;render()}});
render();
})();
</script>
